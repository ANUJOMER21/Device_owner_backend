spring.application.name=backend

# Server Configuration
server.port=${SERVER_PORT:8080}

# PostgreSQL Database Configuration
# For AWS RDS: set DB_HOST, DB_PASSWORD, DB_NAME=postgres (RDS default), DB_SSLMODE=require
# Example: export DB_HOST="..." DB_PASSWORD="..." DB_NAME=postgres DB_SSLMODE="require"
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:da_emilocker}?sslmode=${DB_SSLMODE:disable}&connectTimeout=60&socketTimeout=60
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration (HikariCP) - longer timeout for remote/AWS RDS
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.use_sql_comments=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# JWT Configuration
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-minimum-32-characters-long}
jwt.expiration=86400000

# FCM Configuration
fcm.enabled=true
fcm.service-account-key=classpath:firebase_config.json

# Admin Panel Configuration
admin.password=${ADMIN_PASSWORD:admin123}
admin.password.hash=${ADMIN_PASSWORD_HASH:}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# AWS S3 Configuration (for APK and image uploads - see AWS_S3_SETUP_GUIDE.md)
aws.s3.region=${AWS_S3_REGION:eu-north-1}
aws.s3.bucket-name=${AWS_S3_BUCKET:da-emilocker-uploads}
aws.s3.access-key=${AWS_ACCESS_KEY:}
aws.s3.secret-key=${AWS_SECRET_KEY:}
