# SSL/HTTPS profile – include with: spring.profiles.include=ssl
# Set env: SSL_KEY_STORE (path to .p12), SSL_KEY_STORE_PASSWORD
# When this profile is active, the server serves over HTTPS on server.port (e.g. 8080).

server.ssl.key-store=${SSL_KEY_STORE}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_KEY_ALIAS:tomcat}
